openapi: 3.0.3
info:
  title: Soccer Notebook API
  version: 1.0.0
  description: サッカーノートアプリケーションのAPI

servers:
  - url: http://localhost:8080/api
    description: ローカル開発サーバー

paths:
  /users:
    get:
      summary: ユーザー一覧取得
      responses:
        '200':
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: ユーザー作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: ユーザー作成成功

  /notes:
    get:
      summary: ノート一覧取得
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: ノート一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
      required:
        - id
        - name
        - email

    UserCreateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required:
        - name
        - email

    Note:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - createdAt 