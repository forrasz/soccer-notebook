/users:
  post:
    summary: ユーザー登録
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserCreateRequest'
    responses:
      '201':
        description: ユーザー作成成功
  get:
    summary: ユーザー一覧取得
    responses:
      '200':
        description: ユーザー一覧
/users/{userId}:
  get:
    summary: ユーザー詳細取得
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: ユーザー情報
  put:
    summary: ユーザー情報更新
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserUpdateRequest'
    responses:
      '200':
          description: ユーザー更新成功
  delete:
    summary: ユーザー削除
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    responses:
      '204':
        description: ユーザー削除成功 